name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  lint-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: DeterminateSystems/nix-installer-action@3138316df39ed29be04236d7ffc686fa525866aa # main
      - uses: DeterminateSystems/magic-nix-cache-action@84c0677f58dcedf3b91f8223ce36a9ea5b3c84b7 # main

      - name: lint
        run: nix develop --command just lint

      - name: fmt-check
        run: nix develop --command just fmt-check

      - name: test
        run: nix develop --command just test

      - name: readme-demo
        run: nix develop --command just readme-demo

      # Builds the package and runs it through `git subtrees` in the sandbox.
      - name: nix flake check
        run: nix flake check -L

  compat-matrix:
    # Named after the versions under test rather than the nixpkgs revisions
    # they come from. The test step fails first if a label drifts from what
    # the revision actually ships.
    name: compat (bash ${{ matrix.bash.version }}, git ${{ matrix.git.version }})
    strategy:
      fail-fast: false
      matrix:
        bash:
          - { version: 4.4.23, rev: nixos-21.05 }
          - { version: 5.2.37, rev: nixos-25.05 }
        git:
          - { version: 2.31.1, rev: nixos-21.05 }
          - { version: 2.50.1, rev: nixos-25.05 }
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: DeterminateSystems/nix-installer-action@3138316df39ed29be04236d7ffc686fa525866aa # main
      - uses: DeterminateSystems/magic-nix-cache-action@84c0677f58dcedf3b91f8223ce36a9ea5b3c84b7 # main

      # bash and git are pulled independently from separate pinned nixpkgs
      # revisions -- prebuilt binaries from cache.nixos.org, no compiling --
      # so every {bash, git} pair in the matrix is exercised, not just
      # whatever pairing a single nixpkgs snapshot happens to ship.
      # nixos-21.05 supplies bashInteractive 4.4, the documented floor.
      - name: test
        env:
          BASH_REV: ${{ matrix.bash.rev }}
          GIT_REV: ${{ matrix.git.rev }}
          BASH_EXPECTED: ${{ matrix.bash.version }}
          GIT_EXPECTED: ${{ matrix.git.version }}
        run: |
          # The script is single-quoted so it expands inside the nix shell.
          # shellcheck disable=SC2016
          nix shell \
            "github:NixOS/nixpkgs/$BASH_REV#bashInteractive" \
            "github:NixOS/nixpkgs/$GIT_REV#git" \
            "nixpkgs#bats" \
            "nixpkgs#zsh" \
            --command bash -c '
              set -e
              bash_version="${BASH_VERSION%%(*}"
              git_version="$(git --version | sed "s/^git version //")"
              echo "bash: $bash_version"
              echo "git:  $git_version"
              if [ "$bash_version" != "$BASH_EXPECTED" ] || [ "$git_version" != "$GIT_EXPECTED" ]; then
                echo "::error::matrix label says bash $BASH_EXPECTED, git $GIT_EXPECTED -- update the versions in ci.yml"
                exit 1
              fi
              bats --recursive test
            '

  release-please:
    needs: [lint-test, compat-matrix]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    # One at a time: two runs could both find a tarball missing, and the
    # second upload would fail on the asset the first one just added.
    concurrency:
      group: release-please
      cancel-in-progress: false
    permissions:
      contents: write
    steps:
      # A fine-grained token rather than GITHUB_TOKEN, whose pull requests
      # and tags trigger no workflows, so the release PR would get no CI.
      - uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        id: release
        with:
          token: ${{ secrets.RELEASE_PLEASE_TOKEN }}

      # Not gated on release_created: a rerun after a failed upload sees the
      # release as already created, so this checks every release for what's
      # missing instead.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Attach tarballs to releases that lack one
        # Explicit, so the step runs with pipefail: a failing `gh release
        # list` must not look like there are no releases.
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release list --exclude-pre-releases --exclude-drafts --limit 1000 --json tagName --jq '.[].tagName' |
            while read -r tag; do
              asset="git-subtrees-$tag.tar.gz"
              has_asset="$(gh release view "$tag" --json assets --jq "any(.assets[]; .name == \"$asset\")")"
              if [[ "$has_asset" == true ]]; then
                continue
              fi
              git fetch --depth=1 origin "refs/tags/$tag:refs/tags/$tag"
              git archive --format=tar.gz --prefix=git-subtrees/ -o "$asset" "$tag"
              gh release upload "$tag" "$asset"
            done
