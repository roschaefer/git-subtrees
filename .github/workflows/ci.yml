name: CI

on:
  push:
  pull_request:

jobs:
  lint-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: DeterminateSystems/nix-installer-action@3138316df39ed29be04236d7ffc686fa525866aa # main
      - uses: DeterminateSystems/magic-nix-cache-action@84c0677f58dcedf3b91f8223ce36a9ea5b3c84b7 # main

      - name: lint
        run: nix develop --command just lint

      - name: fmt-check
        run: nix develop --command just fmt-check

      - name: test
        run: nix develop --command just test

  compat-matrix:
    strategy:
      fail-fast: false
      matrix:
        bash_rev: [nixos-21.05, nixos-25.05]
        git_rev: [nixos-21.05, nixos-25.05]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: DeterminateSystems/nix-installer-action@3138316df39ed29be04236d7ffc686fa525866aa # main
      - uses: DeterminateSystems/magic-nix-cache-action@84c0677f58dcedf3b91f8223ce36a9ea5b3c84b7 # main

      # bash and git are pulled independently from separate pinned nixpkgs
      # revisions -- prebuilt binaries from cache.nixos.org, no compiling --
      # so every {bash, git} pair in the matrix is exercised, not just
      # whatever pairing a single nixpkgs snapshot happens to ship.
      # nixos-21.05 supplies bashInteractive 4.4, the documented floor.
      - name: test
        run: |
          nix shell \
            "github:NixOS/nixpkgs/${{ matrix.bash_rev }}#bashInteractive" \
            "github:NixOS/nixpkgs/${{ matrix.git_rev }}#git" \
            "nixpkgs#bats" \
            --command bash -c '
              echo "bash: $(bash --version | head -1)"
              echo "git:  $(git --version)"
              bats --recursive test
            '

  edge-release:
    needs: [lint-test, compat-matrix]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    concurrency:
      group: edge-release
      cancel-in-progress: true
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      # concurrency above only takes effect once this job starts, which is
      # after lint-test/compat-matrix finish -- an older push's prerequisite
      # jobs can still finish after a newer push has already published, so
      # this re-checks that github.sha is still main's tip before publishing
      # to avoid force-moving edge backward.
      - name: Verify this commit is still the tip of main
        id: check
        run: |
          git fetch origin main
          current_tip="$(git rev-parse origin/main)"
          if [[ "$current_tip" != "${{ github.sha }}" ]]; then
            echo "main has moved on to $current_tip; skipping edge release for ${{ github.sha }}"
            echo "is_latest=false" >> "$GITHUB_OUTPUT"
          else
            echo "is_latest=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Build tarball
        if: steps.check.outputs.is_latest == 'true'
        run: |
          mkdir -p dist
          git archive --format=tar.gz --prefix=git-subtrees/ -o dist/git-subtrees-edge.tar.gz HEAD

      - name: Move edge tag to HEAD
        if: steps.check.outputs.is_latest == 'true'
        run: |
          git tag -f edge
          git push origin edge --force

      - name: Publish edge release
        if: steps.check.outputs.is_latest == 'true'
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3
        with:
          tag_name: edge
          name: "Edge (rolling)"
          body: "Rolling build of the latest commit on main (${{ github.sha }})."
          prerelease: true
          make_latest: false
          files: dist/git-subtrees-edge.tar.gz
