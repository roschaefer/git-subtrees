name: CI

on:
  push:
  pull_request:

jobs:
  lint-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: DeterminateSystems/nix-installer-action@3138316df39ed29be04236d7ffc686fa525866aa # main
      - uses: DeterminateSystems/magic-nix-cache-action@84c0677f58dcedf3b91f8223ce36a9ea5b3c84b7 # main

      - name: lint
        run: nix develop --command just lint

      - name: fmt-check
        run: nix develop --command just fmt-check

      - name: test
        run: nix develop --command just test

  compat-matrix:
    # Named after the versions under test rather than the nixpkgs revisions
    # they come from. The test step fails first if a label drifts from what
    # the revision actually ships.
    name: compat (bash ${{ matrix.bash.version }}, git ${{ matrix.git.version }})
    strategy:
      fail-fast: false
      matrix:
        bash:
          - { version: 4.4.23, rev: nixos-21.05 }
          - { version: 5.2.37, rev: nixos-25.05 }
        git:
          - { version: 2.31.1, rev: nixos-21.05 }
          - { version: 2.50.1, rev: nixos-25.05 }
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: DeterminateSystems/nix-installer-action@3138316df39ed29be04236d7ffc686fa525866aa # main
      - uses: DeterminateSystems/magic-nix-cache-action@84c0677f58dcedf3b91f8223ce36a9ea5b3c84b7 # main

      # bash and git are pulled independently from separate pinned nixpkgs
      # revisions -- prebuilt binaries from cache.nixos.org, no compiling --
      # so every {bash, git} pair in the matrix is exercised, not just
      # whatever pairing a single nixpkgs snapshot happens to ship.
      # nixos-21.05 supplies bashInteractive 4.4, the documented floor.
      - name: test
        env:
          BASH_REV: ${{ matrix.bash.rev }}
          GIT_REV: ${{ matrix.git.rev }}
          BASH_EXPECTED: ${{ matrix.bash.version }}
          GIT_EXPECTED: ${{ matrix.git.version }}
        run: |
          # The script is single-quoted so it expands inside the nix shell.
          # shellcheck disable=SC2016
          nix shell \
            "github:NixOS/nixpkgs/$BASH_REV#bashInteractive" \
            "github:NixOS/nixpkgs/$GIT_REV#git" \
            "nixpkgs#bats" \
            "nixpkgs#zsh" \
            --command bash -c '
              set -e
              bash_version="${BASH_VERSION%%(*}"
              git_version="$(git --version | sed "s/^git version //")"
              echo "bash: $bash_version"
              echo "git:  $git_version"
              if [ "$bash_version" != "$BASH_EXPECTED" ] || [ "$git_version" != "$GIT_EXPECTED" ]; then
                echo "::error::matrix label says bash $BASH_EXPECTED, git $GIT_EXPECTED -- update the versions in ci.yml"
                exit 1
              fi
              bats --recursive test
            '

  edge-release:
    needs: [lint-test, compat-matrix]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    concurrency:
      group: edge-release
      cancel-in-progress: true
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      # concurrency above only takes effect once this job starts, which is
      # after lint-test/compat-matrix finish -- an older push's prerequisite
      # jobs can still finish after a newer push has already published, so
      # this re-checks that github.sha is still main's tip before publishing
      # to avoid force-moving edge backward.
      - name: Verify this commit is still the tip of main
        id: check
        run: |
          git fetch origin main
          current_tip="$(git rev-parse origin/main)"
          if [[ "$current_tip" != "${{ github.sha }}" ]]; then
            echo "main has moved on to $current_tip; skipping edge release for ${{ github.sha }}"
            echo "is_latest=false" >> "$GITHUB_OUTPUT"
          else
            echo "is_latest=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Build tarball
        if: steps.check.outputs.is_latest == 'true'
        run: |
          mkdir -p dist
          git archive --format=tar.gz --prefix=git-subtrees/ -o dist/git-subtrees-edge.tar.gz HEAD

      - name: Move edge tag to HEAD
        if: steps.check.outputs.is_latest == 'true'
        run: |
          git tag -f edge
          git push origin edge --force

      - name: Publish edge release
        if: steps.check.outputs.is_latest == 'true'
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3
        with:
          tag_name: edge
          name: "Edge (rolling)"
          body: "Rolling build of the latest commit on main (${{ github.sha }})."
          prerelease: true
          make_latest: false
          files: dist/git-subtrees-edge.tar.gz
