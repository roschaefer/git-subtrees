name: Benchmark

# Informational only: shared runners vary too much between runs for a
# timing threshold to be a reliable check. Skipped for draft PRs, like
# other expensive jobs; ready_for_review runs it once a PR leaves draft.
on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

jobs:
  benchmark:
    if: ${{ !github.event.pull_request.draft }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      - uses: DeterminateSystems/nix-installer-action@3138316df39ed29be04236d7ffc686fa525866aa # main
      - uses: DeterminateSystems/magic-nix-cache-action@84c0677f58dcedf3b91f8223ce36a9ea5b3c84b7 # main

      - name: benchmark this PR against its base
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          git worktree add --detach "$RUNNER_TEMP/base" "$BASE_SHA"
          {
            echo "## Benchmark: this PR vs. its base"
            echo
            echo "\`this\` is this PR's head, \`compared\` is its base (${BASE_SHA:0:7})."
            echo
            nix develop --command bench/run.sh --compare "$RUNNER_TEMP/base/git-subtrees" --runs 3
          } >>"$GITHUB_STEP_SUMMARY"
